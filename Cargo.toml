[workspace]
resolver = "2"
members = [
    "crates/awm-proto",
    "crates/awm-store",
    "crates/awm-service",
    "crates/awm-server",
    "crates/awm-collector",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
awm-proto = { path = "crates/awm-proto" }
awm-store = { path = "crates/awm-store" }
awm-service = { path = "crates/awm-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rusqlite = { version = "0.37", features = ["bundled", "limits"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["compression-gzip"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
urlencoding = "2"
iana-time-zone = "0.1"
tempfile = "3"
